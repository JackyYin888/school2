<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>學生成績表現資料庫</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">成</div>
          <div>
            <p class="eyebrow">補習班管理介面</p>
            <h1>學生成績表現資料庫</h1>
          </div>
        </div>
        <div class="top-actions">
          <button id="addStudentBtn" class="primary-btn" type="button" title="新增學生">
            <span aria-hidden="true">＋</span>
            新增學生
          </button>
          <button id="exportBtn" class="icon-btn" type="button" title="匯出 JSON">
            <span aria-hidden="true">⇩</span>
          </button>
          <button id="resetBtn" class="icon-btn" type="button" title="恢復示範資料">
            <span aria-hidden="true">↺</span>
          </button>
        </div>
      </header>

      <main class="workspace">
        <section class="overview-grid" aria-label="成績摘要">
          <article class="metric-card">
            <span>學生數</span>
            <strong id="studentCount">0</strong>
            <small>目前追蹤人數</small>
          </article>
          <article class="metric-card">
            <span>整體平均</span>
            <strong id="classAverage">0</strong>
            <small>依目前匯入成績計算</small>
          </article>
          <article class="metric-card">
            <span>高關注</span>
            <strong id="attentionCount">0</strong>
            <small>平均低於 70 分</small>
          </article>
          <article class="metric-card accent">
            <span>領先學生</span>
            <strong id="topStudent">-</strong>
            <small id="topStudentMeta">尚無資料</small>
          </article>
        </section>

        <section class="toolbar-panel" aria-label="篩選工具">
          <label class="search-box">
            <span aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" placeholder="搜尋姓名、學號或學校" />
          </label>
          <label class="select-wrap">
            <span>表現</span>
            <select id="statusFilter">
              <option value="all">全部</option>
              <option value="優異">優異</option>
              <option value="穩定">穩定</option>
              <option value="需追蹤">需追蹤</option>
              <option value="高關注">高關注</option>
            </select>
          </label>
          <label class="select-wrap">
            <span>排序</span>
            <select id="sortSelect">
              <option value="avg-desc">平均分高到低</option>
              <option value="avg-asc">平均分低到高</option>
              <option value="trend-desc">科目差距高到低</option>
              <option value="name-asc">姓名排序</option>
            </select>
          </label>
        </section>

        <section class="content-grid">
          <section class="table-panel" aria-label="學生成績">
            <div class="section-heading">
              <div>
                <p class="eyebrow">段考成績總覽</p>
                <h2>學生表現追蹤</h2>
              </div>
              <p id="visibleCount" class="subtle-copy">顯示 0 位學生</p>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr id="tableHeaderRow"></tr>
                </thead>
                <tbody id="studentTableBody"></tbody>
              </table>
            </div>
          </section>

          <aside class="detail-panel" aria-label="學生細節">
            <div class="section-heading compact">
              <div>
                <p class="eyebrow">個別學生</p>
                <h2 id="detailName">請選擇學生</h2>
              </div>
              <button id="editStudentBtn" class="ghost-btn" type="button" disabled>
                編輯
              </button>
            </div>

            <div class="student-summary">
              <div>
                <span>平均</span>
                <strong id="detailAverage">-</strong>
              </div>
              <div>
                <span>排名</span>
                <strong id="detailRank">-</strong>
              </div>
              <div>
                <span>狀態</span>
                <strong id="detailStatus">-</strong>
              </div>
            </div>

            <div class="chart-card">
              <div class="chart-header">
                <span>各科成績輪廓</span>
                <small id="trendLabel">尚未選擇資料</small>
              </div>
              <svg id="scoreChart" viewBox="0 0 640 260" role="img" aria-label="學生成績走勢圖"></svg>
            </div>

            <div class="insight-card">
              <span>建議動作</span>
              <p id="adviceText">點選左側學生後，這裡會顯示對應的追蹤建議。</p>
            </div>
          </aside>
        </section>
      </main>
    </div>

    <dialog id="studentDialog">
      <form id="studentForm" method="dialog" class="dialog-form">
        <div class="dialog-head">
          <div>
            <p class="eyebrow">學生資料</p>
            <h2 id="dialogTitle">新增學生</h2>
          </div>
          <button id="closeDialogBtn" class="icon-btn" type="button" title="關閉">×</button>
        </div>

        <div class="form-grid">
          <label>
            <span>學號</span>
            <input name="id" required />
          </label>
          <label>
            <span>姓名</span>
            <input name="name" required />
          </label>
          <label>
            <span>學校</span>
            <input name="className" required />
          </label>
          <label>
            <span>家長提醒</span>
            <select name="followUp">
              <option value="一般追蹤">一般追蹤</option>
              <option value="需要回饋">需要回饋</option>
              <option value="優先聯繫">優先聯繫</option>
            </select>
          </label>
        </div>

        <fieldset>
          <legend>各科分數</legend>
          <div class="score-input-grid" id="scoreInputs"></div>
        </fieldset>

        <div class="dialog-actions">
          <button id="deleteStudentBtn" class="danger-btn" type="button">刪除</button>
          <div class="dialog-action-right">
            <button id="cancelDialogBtn" class="ghost-btn" type="button">取消</button>
            <button class="primary-btn" type="submit">儲存</button>
          </div>
        </div>
      </form>
    </dialog>

    <script src="./imported-grade-data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
